        <style>
            #splash-screen {
                position: fixed;
                inset: 0;
                display: none; /* Hide by default */
                justify-content: center;
                align-items: center;
                background: white;
                z-index: 9999;
                color: #333;
                font-family: sans-serif;
                font-size: 1.2rem;
                text-align: center;
                padding: 2rem;
                transition: opacity 0.3s ease;
            }

            #splash-text {
                position: relative;
                overflow: hidden;
            }

            #splash-text::after {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 50%;
                height: 100%;
                background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.8) 50%,
                    rgba(255, 255, 255, 0) 100%
                );
                animation: shineEffect 1s infinite;
            }

            @keyframes shineEffect {
                0% {
                    left: -100%;
                }
                100% {
                    left: 200%;
                }
            }

            #app-wrapper {
                display: block; /* Show content by default */
            }
        </style>

        <script>
            // Only show splash for root path
            document.addEventListener('DOMContentLoaded', () => {
                const isRootPath = window.location.pathname === '/'

                // Set splash start time
                window.__splashStart = performance.now()

                if (isRootPath) {
                    // Show splash and hide content for root path
                    const splash = document.getElementById('splash-screen')
                    const wrapper = document.getElementById('app-wrapper')

                    if (splash && wrapper) {
                        splash.style.display = 'flex'
                        wrapper.style.display = 'none'
                    }

                    // Initialize splash content
                    const sentences = [
                        'Booting Reality…',
                        'Your Lab, Orbited.',
                        'Devices. Data. Done.',
                        'World-Wide. Wire-Tight.',
                        'Code → Drive → Repeat.',
                        'Dial In. Drill Down.',
                        'Turn the Key to Anywhere.',
                    ]

                    const splashText = document.getElementById('splash-text')
                    if (splashText) {
                        const randomSentence =
                            sentences[Math.floor(Math.random() * sentences.length)]
                        splashText.textContent = randomSentence
                    }
                }
            })
        </script>
