    window_max_length: 300
  passenger.posture:
    owner: CABIN_CAMERA
    source_allowed:
    - SIMULATOR
    ttl_seconds: 5.0
    allowed_lateness_seconds: 2.0
    simulated_required: true
    window_ttl_seconds: 300.0
    window_max_length: 300
  passenger.head_position:
    owner: CABIN_CAMERA
    source_allowed:
    - SIMULATOR
    ttl_seconds: 5.0
    allowed_lateness_seconds: 2.0
    simulated_required: true
    window_ttl_seconds: 300.0
    window_max_length: 300
