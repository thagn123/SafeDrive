services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      ACTIVE_PROFILE: PRODUCTION_NO_DMS
      SAFEDRIVE_API_KEY: local-android-debug-key
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen2.5:7b-instruct-q4_K_M
      # Ollama runs as its own process, not in this compose file -- host.docker.internal is the
      # Docker Desktop (Windows/Mac) route to a service listening on the host's 11434. On native
      # Linux Docker, the extra_hosts entry below makes the same hostname resolve via the gateway.
      LLM_BASE_URL: http://host.docker.internal:11434
      LLM_TIMEOUT_SECONDS: "20"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
